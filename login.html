<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · ETT In-Process Quality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<style>
:root{
  --lg-bg-1:#14161c; --lg-bg-2:#1b1e27; --lg-surface:#20232d; --lg-surface-2:#262a36;
  --lg-line:#343a48; --lg-ink:#EEF1F6; --lg-ink-2:#A9B0C0; --lg-ink-3:#7D8496;
  --lg-accent:#5AA9E6; --lg-accent-2:#7FC8B7; --lg-accent-3:#C77DD2;
}
body{margin:0}
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(90,169,230,.20), transparent 60%),
    radial-gradient(700px 500px at 105% 10%, rgba(199,125,210,.16), transparent 60%),
    radial-gradient(800px 600px at 50% 120%, rgba(127,200,183,.14), transparent 60%),
    linear-gradient(160deg,var(--lg-bg-1),var(--lg-bg-2) 60%,#0f1116);
}
.login-wrap::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 35%, #000 0%, transparent 72%);
}
.brandmark{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:22px;text-align:center;z-index:1}
.brandmark .glyph{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--lg-accent),var(--lg-accent-3));box-shadow:0 8px 26px -8px rgba(90,169,230,.55)}
.brandmark .glyph svg{width:26px;height:26px}
.welcome{font-size:26px;font-weight:700;color:var(--lg-ink);letter-spacing:-.01em;margin:0}
.welcome .hi{background:linear-gradient(90deg,var(--lg-accent),var(--lg-accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:2px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--lg-ink-3)}

.login-card{
  position:relative;z-index:1;width:100%;max-width:380px;background:var(--lg-surface);
  border:1px solid var(--lg-line);border-radius:14px;padding:30px 28px 28px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.02) inset;
}
.login-card::before{content:"";display:block;height:3px;margin:-30px -28px 22px;border-radius:14px 14px 0 0;
  background:linear-gradient(90deg,var(--lg-accent),var(--lg-accent-3) 50%,var(--lg-accent-2))}
.login-card h1{font-size:16.5px;margin:0 0 2px;color:var(--lg-ink);font-weight:600}
.login-card p.sub{margin:2px 0 22px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lg-ink-3)}
.login-card label.f{margin-bottom:16px}
.login-card label.f>.lb{color:var(--lg-ink-2)}
.login-card input{
  font-size:17px;letter-spacing:.02em;padding:12px 13px;font-variant-numeric:tabular-nums;
  background:var(--lg-surface-2);border:1px solid var(--lg-line);color:var(--lg-ink);
}
.login-card input:focus{border-color:var(--lg-accent);box-shadow:0 0 0 3px rgba(90,169,230,.18)}
.login-card input::placeholder{color:var(--lg-ink-3)}
.login-card .btn.primary{
  width:100%;padding:13px;min-height:48px;font-size:14.5px;margin-top:8px;border:0;color:#0d1117;
  background:linear-gradient(90deg,var(--lg-accent),var(--lg-accent-2));
}
.login-card .btn.primary:hover{filter:brightness(1.08)}
.login-card .btn.primary:disabled{filter:grayscale(.4);opacity:.7}
.pwd-wrap{position:relative}
.pwd-wrap input{width:100%;padding-right:60px;box-sizing:border-box}
.pwd-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  color:var(--lg-ink-3);padding:8px 9px;line-height:1;border-radius:4px}
.pwd-toggle:hover{color:var(--lg-accent);background:rgba(255,255,255,.05)}
.login-err{background:rgba(226,131,108,.14);color:#F0A08C;border:1px solid rgba(226,131,108,.35);border-radius:6px;padding:10px 13px;font-size:13.5px;margin-bottom:14px;display:none}
.login-err.show{display:block}
.login-foot{position:relative;z-index:1;margin-top:22px;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--lg-ink-3)}
</style>
</head>
<body>
<div class="login-wrap">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="brandmark">
      <div class="glyph"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" fill="#0d1117" fill-opacity=".92"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <p class="welcome"><span class="hi">Welcome</span> to InQ Software</p>
        <p class="tagline">ETT In-Process Quality</p>
      </div>
    </div>
    <form class="login-card" id="loginForm">
      <h1>เข้าสู่ระบบ <span class="th" style="font-family:var(--sans);font-weight:400;color:var(--lg-ink-3)">Sign in to continue</span></h1>
      <p class="sub">Enter your credentials</p>
      <div class="login-err" id="loginErr"></div>
      <label class="f"><span class="lb">Username (ชื่อผู้ใช้)</span>
        <input type="text" id="username" autocomplete="username" required></label>
      <label class="f"><span class="lb">Password (รหัสผ่าน)</span>
        <div class="pwd-wrap">
          <input type="password" id="password" autocomplete="current-password" required style="text-transform:none">
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="แสดงรหัสผ่าน" aria-pressed="false">SHOW</button>
        </div>
      </label>
      <button type="submit" class="btn primary" id="btnLogin">Sign in <span class="th">(เข้าสู่ระบบ)</span></button>
    </form>
    <p class="login-foot">ETT TANNERY · QUALITY CONTROL SYSTEM</p>
  </div>
</div>
<div id="toast"></div>
<script src="api.js"></script>
<script>
(function () {
  var existing = getSession();
  if (existing && existing.token) location.href = "index.html";

  var form = document.getElementById("loginForm");
  var errBox = document.getElementById("loginErr");

  var pwdInput = document.getElementById("password");
  var pwdToggle = document.getElementById("pwdToggle");
  pwdToggle.addEventListener("click", function () {
    var showing = pwdInput.type === "text";
    pwdInput.type = showing ? "password" : "text";
    pwdToggle.textContent = showing ? "SHOW" : "HIDE";
    pwdToggle.setAttribute("aria-label", showing ? "แสดงรหัสผ่าน" : "ซ่อนรหัสผ่าน");
    pwdToggle.setAttribute("aria-pressed", String(!showing));
  });
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errBox.classList.remove("show");
    var btn = document.getElementById("btnLogin");
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    if (!username || !password) return;
    btn.disabled = true; btn.textContent = "SIGNING IN…";
    var r = await API.login(username, password);
    btn.disabled = false; btn.innerHTML = 'Sign in <span class="th">(เข้าสู่ระบบ)</span>';
    if (!r.ok) {
      errBox.textContent = r.error || "เข้าสู่ระบบไม่สำเร็จ";
      errBox.classList.add("show");
      return;
    }
    setSession({ token: r.token, username: r.username, role: r.role, fullName: r.fullName });
    var params = new URLSearchParams(location.search);
    location.href = params.get("next") || "index.html";
  });
})();
</script>
</body>
</html>
